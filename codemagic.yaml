workflows:
  soft-ecommerce-ios:
    name: Soft Ecommerce iOS

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 26.6
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: br.com.softsistemas.softecommerce

      vars:
        SOFT_API_BASE_URL: "http://softpinhais.ddns.net:8585/ecommerce/api/mobile/v1"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Mostrar ambiente
        script: |
          echo "=================================================="
          echo "SOFT ECOMMERCE - BUILD IOS"
          echo "=================================================="
          flutter --version
          dart --version
          xcodebuild -version
          echo "Build Codemagic: $BUILD_NUMBER"
          echo "API: $SOFT_API_BASE_URL"
          echo "=================================================="

      - name: Preparar projeto iOS
        script: |
          chmod +x tooling/*.sh || true

          ./tooling/prepare_ios.sh "$SOFT_API_BASE_URL"

      - name: Obter dependencias Flutter
        script: |
          flutter pub get

      - name: Instalar CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Configurar assinatura iOS
        script: |
          xcode-project use-profiles

      - name: Mostrar configuracao gerada
        script: |
          echo "Bundle ID:"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" ios/Runner.xcodeproj/project.pbxproj | head -10 || true

          echo ""
          echo "Versao:"
          grep "^version:" pubspec.yaml || true

          echo ""
          echo "Info.plist:"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" ios/Runner/Info.plist || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" ios/Runner/Info.plist || true

      - name: Analisar projeto Flutter
        script: |
          flutter analyze
        ignore_failure: true

      - name: Compilar IPA
        script: |
          flutter build ipa \
            --release \
            --dart-define=SOFT_API_BASE_URL="$SOFT_API_BASE_URL" \
            --build-name=1.6.20 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/archive/*.xcarchive
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
