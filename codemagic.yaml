workflows:
  soft-ecommerce-ios-debug:
    name: Soft Ecommerce iOS - Build sem assinatura

    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      flutter: stable
      xcode: 26.6
      cocoapods: default

      vars:
        SOFT_API_BASE_URL: "http://softpinhais.ddns.net:8585/ecommerce/api/mobile/v1"

    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods

    scripts:
      - name: Preparar iOS
        script: |
          chmod +x tooling/*.sh || true
          ./tooling/prepare_ios.sh "$SOFT_API_BASE_URL"

      - name: Dependencias Flutter
        script: |
          flutter pub get

      - name: CocoaPods
        script: |
          cd ios
          pod install
          cd ..

      - name: Analisar
        script: |
          flutter analyze
        ignore_failure: true

      - name: Compilar iOS sem assinatura
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=SOFT_API_BASE_URL="$SOFT_API_BASE_URL" \
            --build-name=1.6.20 \
            --build-number=$BUILD_NUMBER

    artifacts:
      - build/ios/iphoneos/Runner.app
      - /tmp/xcodebuild_logs/*.log
