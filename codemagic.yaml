# Para o projeto iOS 1.6.32. Substitua codemagic.yaml na raiz, junto de pubspec.yaml.
# Fluxo temporario enquanto aguarda a conta/perfis Apple.
# Gera Runner.app em release SEM ASSINATURA. Nao instala em iPhone/TestFlight.
# Identidade, versao e build continuam sincronizados da API em prepare_ios.sh.
workflows:
  ios-sem-assinatura:
    name: Soft Ecommerce iOS - Release sem assinatura Apple
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.35.5
      xcode: latest
      cocoapods: default
      vars:
        SOFT_API_BASE_URL: "https://domlevi.com.br/api/mobile/v1"
        CI: "true"
        FLUTTER_SUPPRESS_ANALYTICS: "true"
    scripts:
      - name: Preparar API, branding e projeto iOS
        script: |
          set -euo pipefail
          bash tooling/prepare_ios.sh "$SOFT_API_BASE_URL"
      - name: Compilar iOS release sem assinatura
        script: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --dart-define="SOFT_API_BASE_URL=$SOFT_API_BASE_URL"
      - name: Empacotar aplicativo sem assinatura
        script: |
          set -euo pipefail
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent \
            build/ios/iphoneos/Runner.app \
            build/ios/Runner-release-sem-assinatura.zip
    artifacts:
      - build/ios/Runner-release-sem-assinatura.zip
      - /tmp/xcodebuild_logs/*.log

